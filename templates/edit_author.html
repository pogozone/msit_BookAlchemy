{% extends "base.html" %}

{% block content %}
<div class="library-container">
    {% if message %}
        <div class="notification">{{ message }}</div>
    {% endif %}
    <form action="{{ url_for('edit_author', author_id=author.id) }}" method="POST">
        <fieldset>
            <legend>Autor {{ author.name }} bearbeiten</legend>

            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required value="{{ author.name }}">
            </div>

            <div>
                <label for="birth_date">Geburtsdatum:</label>
                <input type="date" id="birth_date" name="birth_date" value="{{ author.birth_date }}">
            </div>

            <div>
                <label for="date_of_death">Sterbedatum:</label>
                <input type="date" id="date_of_death" name="date_of_death" value="{{ author.date_of_death }}">
            </div>

            <button type="submit">Speichern</button>
        </fieldset>
    </form>
</div>
{% endblock %}
